name: Sconti caffeina

# Bot Telegram che gira interamente su GitHub Actions: nessun PC, nessun server.
# Ogni 15 minuti: legge i comandi in coda su Telegram e, se è ora, scansiona Amazon.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: caffeina-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ripristina stato (storico prezzi, chat id, offset comandi)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: caffeina-state-${{ github.run_id }}
          restore-keys: caffeina-state-

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Comandi + scansione
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py cloud

      - name: Salva stato
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: caffeina-state-${{ github.run_id }}
